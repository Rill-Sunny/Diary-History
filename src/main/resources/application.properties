server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
spring.application.name=liubai-diary
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/liubai_diary?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B00%3A00&forceConnectionTimeZoneToSession=true
spring.datasource.username=liubai_app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=15
app.base-url=http://localhost:5173
app.time-zone=Asia/Shanghai
app.media.root=./var/media
app.mail.from=no-reply@localhost
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
